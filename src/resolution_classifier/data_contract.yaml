# Modeling table for the same-event pair classifier.
# One row per candidate pair. Columns and their order match
# resolution_classifier.pair_encoder.FRAME_COLUMNS. Raw left_emb_* and
# right_emb_* stay on the extract. The model columns are emb_abs_diff_000..383,
# each abs(right_emb_N - left_emb_N).
# The fitted ColumnTransformer (pair_encoder.make_preprocess) does the numeric
# encoding; this contract checks the engineered table that 02_engineer writes.
version: 3
mock_sql: src/resolution_classifier/queries/pairs.sql

columns:
  left_source:
    dtype: string
    nullable: false
    role: [join_key]
    transform: passthrough
  left_id:
    dtype: string
    nullable: false
    role: [join_key]
    transform: passthrough
  right_source:
    dtype: string
    nullable: false
    role: [join_key]
    transform: passthrough
  right_id:
    dtype: string
    nullable: false
    role: [join_key]
    transform: passthrough
  emb_score:
    dtype: float
    nullable: true
    role: [feature]
    transform: pair_score
  cross_score:
    dtype: float
    nullable: true
    role: [feature]
    transform: pair_score
  event_score:
    dtype: float
    nullable: true
    role: [feature]
    transform: pair_score
